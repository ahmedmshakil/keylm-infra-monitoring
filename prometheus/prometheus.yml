global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: keylm-app
    scheme: https
    metrics_path: /api/metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/keylm_metrics_token
    static_configs:
      - targets:
          - keylm.shakilahmed.tech
        labels:
          service: keylm

  - job_name: azure-vm-node
    static_configs:
      - targets:
          - node-exporter:9100
        labels:
          service: azure-vm
